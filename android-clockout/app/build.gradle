plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("../.secrets/clock-out-signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "io.github.amuuuune.overtimeclockout"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.amuuuune.overtimeclockout"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    if (!signingProperties.isEmpty()) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (!signingProperties.isEmpty()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

