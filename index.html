<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>残業管理ツール</title>
    <link rel="stylesheet" href="styles.css?v=36">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  </head>
  <body>
    <main class="app-shell">
      <section class="quick-clock-out-view" id="quickClockOutView" aria-labelledby="quickClockOutHeading" hidden>
        <div class="quick-clock-out-mark" id="quickClockOutMark" aria-hidden="true">✓</div>
        <p class="section-kicker">退勤打刻</p>
        <h1 id="quickClockOutHeading">打刻しています</h1>
        <p class="quick-clock-out-summary" id="quickClockOutSummary">現在時刻を確認しています。</p>
        <p class="small-note quick-clock-out-note" id="quickClockOutNote"></p>
        <a class="ghost-action quick-clock-out-link" href="./index.html">記録を見る</a>
      </section>

      <div id="homeView">
        <header class="topbar">
          <h1>残業管理ツール</h1>
        </header>

        <section class="cloud-panel" aria-label="保存先">
          <div class="cloud-compact-row">
            <span class="cloud-label">保存先</span>
            <span class="cloud-pill" id="cloudState">確認中</span>
            <button class="cloud-link" id="toggleAuth" type="button">ログイン</button>
            <button class="cloud-link" id="syncCloud" type="button" hidden>同期</button>
            <button class="cloud-link" id="signOut" type="button" hidden>ログアウト</button>
          </div>
          <form class="auth-form" id="authForm" hidden>
            <label>
              <span>メールアドレス</span>
              <input id="authEmail" name="authEmail" type="email" autocomplete="email" inputmode="email" placeholder="mail@example.com" required>
            </label>
            <button class="secondary-action" id="authSubmit" type="submit">ログインメールを送る</button>
          </form>
          <form class="auth-form auth-link-form" id="authLinkForm" hidden>
            <label>
              <span>メール内のログインリンク</span>
              <input id="authLink" name="authLink" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="リンクを長押ししてコピー">
            </label>
            <button class="secondary-action" id="authLinkSubmit" type="submit">コピーしたリンクでログイン</button>
          </form>
          <p class="small-note cloud-message" id="cloudMessage" hidden>ログインするとSupabaseへ保存します。</p>
        </section>

        <section class="summary-panel" aria-labelledby="summary-heading">
          <div class="period-row">
            <button class="ghost-action js-prev-period" type="button" aria-label="前の期間">‹</button>
            <h2 id="summary-heading"></h2>
            <button class="ghost-action js-next-period" type="button" aria-label="次の期間">›</button>
          </div>

          <div class="summary-grid">
            <div>
              <span>残業日数</span>
              <strong id="recordCount">0日</strong>
            </div>
            <div>
              <span>合計</span>
              <strong id="totalOvertime">0分</strong>
            </div>
            <div>
              <span>平均</span>
              <strong id="averageOvertime">0分</strong>
            </div>
          </div>
        </section>

        <section class="action-panel" aria-label="退勤打刻">
          <button class="primary-action" id="clockOutNow" type="button">
            退勤打刻
          </button>

          <form class="manual-form" id="recordForm">
            <label>
              <span>勤務日</span>
              <input id="workDate" name="workDate" type="date" required>
            </label>

            <label>
              <span>退勤時刻</span>
              <input id="clockOutTime" name="clockOutTime" type="time" required>
            </label>
            <details class="special-options">
              <summary>特殊な勤務</summary>
              <div class="special-grid">
                <label class="checkbox-line">
                  <input id="holidayWork" name="holidayWork" type="checkbox">
                  <span>休日出勤</span>
                </label>
                <label class="checkbox-line">
                  <input id="earlyWork" name="earlyWork" type="checkbox">
                  <span>早出</span>
                </label>
                <div class="early-punch-panel" id="earlyPunchPanel" hidden>
                  <p class="input-hint" id="earlyPunchStatus">出勤時に打刻します。</p>
                  <button class="ghost-action compact-action" id="clockInEarly" type="button">出勤打刻</button>
                </div>
              </div>
            </details>

            <button class="secondary-action" type="submit">手入力で退勤打刻</button>
            <button class="ghost-action" id="cancelEdit" type="button" hidden>修正をキャンセル</button>
          </form>
          <p class="status-line" id="statusMessage" role="status" aria-live="polite"></p>
        </section>

        <section class="records-panel" aria-label="期間の記録">
          <div class="period-row records-period-row">
            <button class="ghost-action js-prev-period" type="button" aria-label="前の期間">‹</button>
            <p class="records-period-label" id="recordsPeriodLabel"></p>
            <button class="ghost-action js-next-period" type="button" aria-label="次の期間">›</button>
          </div>

          <div class="chart-wrap" id="recordsChart" role="group" aria-label="この期間の残業時間グラフ"></div>
          <div class="trend-block">
            <div class="trend-heading">
              <h3>1年の推移</h3>
            </div>
            <div class="trend-chart" id="trendChart" role="group" aria-label="1年分の月別残業時間"></div>
            <p class="small-note trend-note">棒をタップして期間を切り替え</p>
          </div>
          <p class="small-note records-mode-note" id="recordsModeNote"></p>
          <div class="records-list" id="recordsList"></div>
        </section>
      </div>

      <section class="detail-view" id="detailView" aria-labelledby="detail-heading" hidden>
        <button class="ghost-action back-action" id="backToList" type="button">一覧へ戻る</button>
        <div class="detail-title-row">
          <p class="section-kicker">記録詳細</p>
          <h2 id="detail-heading"></h2>
        </div>
        <dl class="detail-grid">
          <div>
            <dt>退勤</dt>
            <dd id="detailClockOut"></dd>
          </div>
          <div>
            <dt>残業</dt>
            <dd id="detailOvertime"></dd>
          </div>
          <div>
            <dt>更新</dt>
            <dd id="detailUpdated"></dd>
          </div>
        </dl>
        <div class="detail-actions">
          <button class="secondary-action" id="editSelectedRecord" type="button">修正</button>
          <button class="danger-action" id="deleteSelectedRecord" type="button">削除</button>
        </div>
      </section>
    </main>

    <template id="recordItemTemplate">
      <button class="record-row" type="button">
        <span class="record-date"></span>
        <span class="record-time"></span>
        <strong class="record-total"></strong>
        <span class="record-open">詳細</span>
      </button>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="app.js?v=36" defer></script>
  </body>
</html>
