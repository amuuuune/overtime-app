<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#149653">
    <title>退勤ボタンを追加</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/clock-out-192.png">
    <link rel="apple-touch-icon" href="../icons/clock-out-192.png">
    <script>
      if (new URLSearchParams(window.location.search).get("launch") === "clockout") {
        window.location.replace("../index.html?action=clockout");
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --page: #f6f7f9;
        --surface: #ffffff;
        --ink: #171717;
        --muted: #626262;
        --line: #d9dee3;
        --accent: #149653;
        --accent-pressed: #0d713d;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        min-height: 100vh;
        max-width: 720px;
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
        background: var(--surface);
        text-align: center;
      }

      .app-icon {
        width: 96px;
        height: 96px;
        margin-bottom: 8px;
        border-radius: 8px;
      }

      h1,
      p {
        margin: 0;
        overflow-wrap: anywhere;
        letter-spacing: 0;
      }

      h1 {
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        color: var(--muted);
      }

      button,
      a {
        display: grid;
        place-items: center;
        min-height: 48px;
        width: min(100%, 22rem);
        border-radius: 8px;
        padding: 11px 16px;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0;
        text-decoration: none;
      }

      button {
        margin-top: 12px;
        border: 0;
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }

      button:active {
        background: var(--accent-pressed);
      }

      a {
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
      }

      .status {
        min-height: 3em;
        max-width: 30rem;
        font-size: 0.86rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="app-icon" src="../icons/clock-out-192.png" alt="">
      <h1>退勤ボタンを追加</h1>
      <p>ホーム画面から1回タップで現在時刻を打刻します。</p>
      <button id="installButton" type="button">ホーム画面に追加</button>
      <p class="status" id="installStatus" role="status" aria-live="polite">
        ボタンを押して追加してください。
      </p>
      <a href="../index.html">残業管理ツールへ戻る</a>
    </main>

    <script>
      (function () {
        "use strict";

        const installButton = document.getElementById("installButton");
        const installStatus = document.getElementById("installStatus");
        let installPrompt = null;

        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          installPrompt = event;
          installStatus.textContent = "追加できます。";
        });

        window.addEventListener("appinstalled", () => {
          installPrompt = null;
          installButton.disabled = true;
          installButton.textContent = "追加しました";
          installStatus.textContent = "ホーム画面の「退勤」から打刻できます。";
        });

        installButton.addEventListener("click", async () => {
          if (!installPrompt) {
            installStatus.textContent =
              "Chrome右上のメニューから「アプリをインストール」または「ホーム画面に追加」を選んでください。";
            return;
          }

          installPrompt.prompt();
          const choice = await installPrompt.userChoice;
          if (choice.outcome !== "accepted") {
            installStatus.textContent = "追加をキャンセルしました。";
          }
          installPrompt = null;
        });

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("../service-worker.js", { scope: "../" }).catch(() => {});
        }
      })();
    </script>
  </body>
</html>
