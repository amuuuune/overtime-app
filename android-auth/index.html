<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>退勤アプリ連携</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202522;
        background: #fff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 40px, 420px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: #5f6762;
        line-height: 1.7;
      }

      button {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 6px;
        padding: 12px 18px;
        color: #fff;
        background: #159a55;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        color: #6b736e;
        background: #e8ece9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">退勤アプリを連携します</h1>
      <p id="message">自動で開かない場合は、下のボタンを押してください。</p>
      <button id="openApp" type="button">退勤アプリを開く</button>
    </main>
    <script>
      (() => {
        "use strict";

        const hash = window.location.hash;
        const params = new URLSearchParams(hash.startsWith("#") ? hash.slice(1) : hash);
        const button = document.getElementById("openApp");
        const heading = document.getElementById("heading");
        const message = document.getElementById("message");

        if (!params.get("access_token") || !params.get("refresh_token")) {
          heading.textContent = "連携できませんでした";
          message.textContent = params.get("error_description") || "ログインメールをもう一度送信してください。";
          button.disabled = true;
          return;
        }

        const appUrl = `intent://auth?${params.toString()}`
          + "#Intent;scheme=overtimeclockout;"
          + "package=io.github.amuuuune.overtimeclockout;end";
        window.history.replaceState(null, "", window.location.pathname);

        const openApp = () => {
          window.location.href = appUrl;
        };

        button.addEventListener("click", openApp);
        window.setTimeout(openApp, 120);
      })();
    </script>
  </body>
</html>
